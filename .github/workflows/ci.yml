name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r ai-clipper/backend/requirements.txt
        pip install -r ai-clipper/backend/requirements-dev.txt
        
    - name: Run Pytest
      run: |
        cd ai-clipper/backend
        # set dummy env vars if needed for the test to pass
        export GROQ_API_KEY="dummy_key"
        pytest tests/

  frontend-build:
    name: Frontend Build (Node.js)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'ai-clipper/frontend/package-lock.json'
        
    - name: Install dependencies
      run: |
        cd ai-clipper/frontend
        npm ci
        
    - name: Build project
      run: |
        cd ai-clipper/frontend
        npm run build
